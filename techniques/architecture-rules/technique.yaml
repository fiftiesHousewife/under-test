# yaml-language-server: $schema=../../schema/technique.schema.json
id: architecture-rules
name: Architecture rules (ArchUnit)
workstream: make-code-testable
evidence_for_maturity_levels: [2, 3]
tools: [archunit]
needed_when:
  - Code has been or will be put behind interfaces, or its layers are to be kept apart
possible_when:
  - The layers or interfaces the rules would protect exist
reject_or_defer_when:
  - Tiny repos
precondition_checks:
  - {done_by: tool, check: Module count}
fallback: None needed
references: [legacy-code]
