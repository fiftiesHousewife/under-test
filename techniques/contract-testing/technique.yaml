# yaml-language-server: $schema=../../schema/technique.schema.json
id: contract-testing
name: Contract tests (Pact)
workstream: make-it-run-on-its-own
test_stand_in_approach: contract
evidence_for_maturity_levels: [3]
tools: [pact-jvm, pact-js]
needed_when:
  - The repo calls, or is called by, a service another team in the organisation owns
reject_or_defer_when:
  - The provider is an external vendor's API
precondition_checks:
  - {done_by: person, check: Provider team agreement, outside_approval: true}
fallback: Recorded stubs plus scheduled checks against a live sandbox
references: [test-doubles]
constraints:
  - Pacts are shared as versioned artifacts through the package repository, without a broker, until a team owns one
  - Current Pact JVM needs JDK 17 or newer; services on older JDKs need the 4.5 line
  - JUnit 6 support in Pact JVM is not yet documented; check before relying on it
