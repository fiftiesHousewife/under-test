# yaml-language-server: $schema=../../schema/technique.schema.json
id: testcontainers
name: Testcontainers
workstream: make-it-run-on-its-own
test_stand_in_approach: run-in-container
evidence_for_maturity_levels: [1, 2, 3]
tools: [testcontainers]
needed_when:
  - Infrastructure you own (database, broker, cache)
possible_when:
  - A container runtime is available to tests (CI today; developer machines if WSL2 is enabled)
reject_or_defer_when:
  - Licensed product with no image (for example certain mainframe middleware)
precondition_checks:
  - {done_by: tool, check: Runtime check in CI}
  - {done_by: tool, check: Image exists in the organisation's package repository}
fallback: fake-behind-an-interface
constraints: ["Images only from the organisation's own registry, through Testcontainers' image name substitution: an outside image gets there by passing the organisation's security scan (a small, minimal image is likeliest to) or by being rebuilt on its own base image; never pulled straight from a public registry such as Docker Hub", Container tests only (integrationTest source set); run in CI today, locally once WSL2 is available; see the decision guide on container tests on developer machines that have no container runtime]
references: [test-doubles]
