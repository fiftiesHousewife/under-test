# yaml-language-server: $schema=../../schema/technique.schema.json
id: characterisation-tests
name: "Characterisation tests (record what the code does today, at a place where inputs and outputs can be reached, before changing it)"
workstream: record-current-behaviour
evidence_for_maturity_levels: [1, 2]
tools: [approvaltests-java, mockito, system-stubs, logcaptor]
adopt_when:
  - "Code must change soon and nobody can say exactly what it does"
  - "There are no tests, or the tests only run the code without checking results"
reject_or_defer_when:
  - "The code is being retired rather than changed"
precondition_checks:
  - {done_by: tool, check: "The code builds and runs on its own (make-it-run-on-its-own done first)"}
  - {done_by: person, check: "A test point is chosen: a place where inputs can be fed in and outputs read without editing the logic"}
fallback: structured-output-comparison
constraints:
  - "The tests record what the code does, including its bugs; a known bug becomes an open question for the Application Owner, not a silent fix"
  - "Use Mockito (which can replace static and final methods) for hard-wired calls; never PowerMock or JMockit, which no longer work on current Java"
  - "Use System Stubs for environment variables, System.exit and standard input in old command-line programs"
references: [legacy-code]
