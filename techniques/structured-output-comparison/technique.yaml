# yaml-language-server: $schema=../../schema/technique.schema.json
id: structured-output-comparison
name: Comparing structured output (snapshot, approval or golden-master tests at the boundary)
workstream: record-current-behaviour
evidence_for_maturity_levels: [2]
tools: [approvaltests-java, xmlunit, jsonunit, datacompy]
adopt_when:
  - Output is deterministic or can be normalised
  - Structured output such as JSON, files or reports
  - Captured and cleaned output from a real run is available as examples
reject_or_defer_when:
  - Output is dominated by timestamps or IDs that cannot be normalised
  - The boundary is about to be replaced
precondition_checks:
  - {done_by: tool, check: Run twice and diff the outputs}
constraints:
  - "Compare structured output with a tool that ignores what doesn't matter: XMLUnit for XML, JSONUnit for JSON, datacompy for tables and CSV"
fallback: property-based-testing
application_types: [web-service, batch-job, message-consumer]
references: [legacy-code]
