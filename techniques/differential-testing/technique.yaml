# yaml-language-server: $schema=../../schema/technique.schema.json
id: differential-testing
name: Differential testing (replay recorded traffic against old and new versions and compare)
workstream: check-in-production
evidence_for_maturity_levels: [3, 5]
tools: [keploy, wiremock, approvaltests]
adopt_when:
  - Migrations, refactors or platform moves where the old version is the source of expected results
  - Read-heavy endpoints
reject_or_defer_when:
  - Endpoints with side effects (writes) and no isolated sink
  - No traffic mirroring
precondition_checks:
  - {done_by: person, check: Modernisation in scope}
  - {done_by: tool, check: Share of endpoints that are read-only}
fallback: Replay saved, cleaned requests against old and new builds offline, with recorded responses for their dependencies
constraints:
  - Offline replay by default; live comparison only on read-only endpoints, with named approvals
  - Not Diffy - the original is archived and its only fork has a non-commercial licence
  - "For a parallel run inside the code (old and new side by side, compare, keep serving the old result), write a small wrapper: the Java and JavaScript ports of GitHub's Scientist library are no longer maintained"
references: [legacy-code]
