# The secrets scan's rules, for gitleaks (https://github.com/gitleaks/gitleaks), version 8.21 or later: gitleaks' own
# rules, plus keystores and private key files found by name, which gitleaks' own rules don't all find.
#
# Run over the whole history, before any of the repo's code is built or run:
#   gitleaks git --config secrets.gitleaks.toml --report-format json --report-path secrets.json .
# A keystore deleted from the current files is still found in the commit that added it, so it blocks until it is
# removed from the history.
#
# The rules added here are tagged like the safety inventory's (kind:<kind>, tier:<effect>); gitleaks' own rules have
# no tags, and every finding from them blocks.

title = "Secrets scan"

[extend]
useDefault = true

# Keystores and private keys ------------------------------------------------------------------------------------------

[[rules]]
id = "keystore-file"
description = "A keystore or certificate store, which usually holds a private key"
path = '''(?i)\.(?:jks|jceks|keystore|truststore|p12|pfx|bks|pkcs12)$'''
tags = ["safety-inventory", "kind:keystore-or-private-key", "tier:blocks"]

[[rules]]
id = "private-key-file"
description = "A private key file"
path = '''(?i)(?:^|/)(?:id_(?:rsa|dsa|ecdsa|ed25519)|[^/]+\.(?:key|pem|ppk))$'''
tags = ["safety-inventory", "kind:keystore-or-private-key", "tier:blocks"]
