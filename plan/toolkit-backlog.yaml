    parent: "the-toolkit-supports-every-step-of-a-repos-journey"
    phase: "pilots"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "With no airgap reports, the draft-the-connection-list skill drafts a connection for each address in the repo's settings files, marked as found in settings"
      - "Settings files include Spring XML contexts and the files they load (imports and property placeholders); XML namespace, schema-location and DTD addresses are never connections"
      - "With reports, a connection found in both is one connection with both sources, and one found only by the agent is added"
      - "Its eval case has a variant with no reports, and both pass in every run"
  - key: "field-trial-the-journey-on-messy-public-repos"
    type: "deliverable"
    title: "Field trial: run the whole journey on two or three messy public repos and turn each break into an eval case"
    parent: "the-toolkit-supports-every-step-of-a-repos-journey"
    phase: "pilots"
    horizon: "now"
    owner_role: "Technical Architect"
    done_by: "person"
    done_when:
      - "A run sheet records, for each repo and skill: worked or broke, where a person stepped in, tool calls and time"
      - "Two or three public repos are chosen, at least one built with Maven, with JUnit 4, an old JDK, tests that reach outside the machine and known flaky or disabled tests"
      - "A person with an AI assistant runs every journey skill on each repo in order, the safety inventory first and the code only under the airgap agent"
      - "Every place a skill breaks, stops, or needs a person to step in is recorded, with tool calls and time for each step"
      - "Each break becomes a cut-down eval case, or a backlog item where the skill can't cover it yet"
      - "A write-up of what the trial found is linked from the skill evaluations"
    blocked_by:
