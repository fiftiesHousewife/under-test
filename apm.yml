# yaml-language-server: $schema=https://microsoft.github.io/apm/specs/schemas/manifest-v0.1.schema.json
# The toolkit as one APM (Agent Package Manager) package. A repo that names it at a release tag in its own apm.yml
# gets the skills listed in .apm/skills/ copied where its AI assistant finds them, and the whole toolkit (decision
# guides, schemas, technique rules, templates, tools) in apm_modules/, where the skills read it.
# devDependencies are for maintaining the toolkit itself: `apm install` here installs them; adopters never get them.
name: under-test
version: 0.1.0
targets: [claude, copilot]
devDependencies:
  apm:
    # Interview a person about a decision, one round of questions at a time (Matt Pocock, MIT licence).
    - mattpocock/skills/skills/productivity/grilling#v1.3.2
    # Write decision records in MADR form (wshobson/agents, MIT licence).
    - git: wshobson/agents
      path: plugins/documentation-generation/skills/architecture-decision-records
      ref: 42203085cfc5736204bf0f6d436dff7e1da0bf3f
