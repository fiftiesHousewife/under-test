    reason: "adopt: 'A connection's stand-in needs a container or a real system, and the machines local tests run on can't provide one', the orders database stand-in runs in a container and developers' machines can't run containers."
  techniques/feature-flags:
    state: proposed
    drafted_by: ai
    choice: defer
    reason: "defer: every level in evidence_for_maturity_levels (5) is above the target level 4. Brought back when the target level is raised to 5."
  techniques/in-memory-databases:
    state: proposed
    drafted_by: ai
    choice: adopt
    reason: "adopt: 'The code reads or writes a relational database, and the machines local tests run on can't run containers', it uses Spring Data JPA on Oracle and developers' machines can't run containers. Waits for make-it-run-on-its-own."
  techniques/junit-tags:
    state: proposed
    drafted_by: ai
    choice: adopt
    reason: "adopt: 'Tests reach a shared system (the reaches-shared-system anti-pattern)', 6 tests reach a shared system; 'Broad or container tests are part of the test mix (tests.mix)', 29 broad tests; 'A connection's stand-in runs in a container', the orders database stand-in is run-in-container."
  techniques/machine-state-checks:
    state: proposed
    drafted_by: ai
    choice: defer
    reason: "defer: 'Install, deploy or configuration scripts set up servers or containers' is unknown; no such scripts were given. Check whether install or deploy scripts exist and whether failures appear only after deployment. Brought back when either needed_when condition is shown true."
  techniques/mockito-well-used:
    state: proposed
    drafted_by: ai
