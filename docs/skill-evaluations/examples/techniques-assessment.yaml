    choice: defer
    reason: "defer: 'A batch job reads files or tables and writes files or tables' is unknown; a nightly reminder job and an invoice exporter exist but their inputs and outputs weren't given. Check what the jobs read and write. Brought back when a batch job that reads and writes files or tables is confirmed."
  techniques/business-rule-tests:
    state: proposed
