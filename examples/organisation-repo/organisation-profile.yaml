# yaml-language-server: $schema=../../schema/organisation-profile.schema.json
# Example only. Copy this folder into your organisation's PRIVATE organisation repo and fill in real values there.
toolkit:
  version: 0.1.0
  source_mirror: https://git.example.com/mirrors/under-test
organisation:
  name: Example Organisation
  organisation_repo: https://git.example.com/testing/under-test-organisation
  repo_count_estimate: 1000
issue_tracker:
  kind: github-issues
  url: https://github.com/example-org/testing-programme
code_hosting:
  kind: github-enterprise-cloud
  url: https://github.com/example-org
ci:
  platform: github-actions
  runs_on: virtual-machines
  image_build_tool: docker
  container_runtime_for_tests: docker
developer_machines:
  operating_systems: [macos, linux]
  container_runtime_available: true
package_repository:
  kind: nexus
  url: https://packages.example.com
ai_assistants:
  allowed: [an approved AI coding assistant]
  independent_agents_allowed: false
commit_messages:
  must_name_work_item: false
  # An organisation with a "no commit without a work item" rule would set, for example:
  # must_name_work_item: true
  # work_item_key_pattern: "[A-Z][A-Z0-9]+-[0-9]+"
  # enforced_by: [commit-message-hook, ci-check, server-side-rule]
deployment_records: The organisation's deployment tool
secrets_scanning: none yet
production_hosts: DNS zones marked as production
tools:
  connection_paths_jar: https://packages.example.com/tools/connection-paths/0.2.0/connection-paths.jar
  maven: mvn
  gradle: gradle
roles:
  programme_sponsor: example-sponsor
  engagement_lead: example-engagement-lead
  technical_architect: example-architect
  test_quality_lead: example-test-quality-lead
  security_and_platform_owner: example-security-team
  toolkit_owner: example-toolkit-team
  steering_group: [example-sponsor, example-engagement-lead, example-architect, example-security-team]
